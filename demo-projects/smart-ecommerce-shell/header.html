<header class="sec-shell-header" data-sec-shell-header>
  <div class="sec-shell-header__brand">
    <smart-logo variant="default" class="sec-shell-header__logo"></smart-logo>
  </div>
  <nav class="sec-shell-header__nav" id="sec-shell-navigation" aria-label="Navigazione principale">
    <smart-menu location="topic" class="sec-shell-header__menu" depth="2"></smart-menu>
  </nav>
  <div class="sec-shell-header__tools">
    <div class="sec-shell-header__social" aria-label="Canali social">
      <smart-social class="sec-shell-header__social-link"></smart-social>
    </div>
    <a class="sec-shell-header__cta" href="/contatti/">Parliamo</a>
    <button class="sec-shell-header__toggle" type="button" aria-expanded="false" aria-controls="sec-shell-navigation">
      <span class="sec-shell-header__toggle-lines" aria-hidden="true"></span>
      <span class="screen-reader-text">Apri menu</span>
    </button>
  </div>
</header>
