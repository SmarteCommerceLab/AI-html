name: Build WordPress Theme Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REPOSITORY_FTP_HOST: repository.smartecommerce.it
      REPOSITORY_FTP_UPDATES_PATH: /httpdocs/updates/themes
      REPOSITORY_FTP_DOWNLOADS_PATH: /httpdocs/downloads/themes
      REPOSITORY_FTP_USER: ${{ secrets.REPOSITORY_FTP_USER }}
      REPOSITORY_FTP_PASSWORD: ${{ secrets.REPOSITORY_FTP_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Validate theme version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          HEADER_VERSION="$(grep -E '^Version:' style.css | head -n1 | sed -E 's/Version:[[:space:]]*//')"
          CONSTANT_VERSION="$(grep -E "define\\('AIHL_VERSION'" functions.php | head -n1 | sed -E "s/.*'([^']+)'.*/\\1/")"
          STABLE_TAG="$(grep -E '^Stable tag:' readme.txt | head -n1 | sed -E 's/Stable tag:[[:space:]]*//')"

          if [ "$HEADER_VERSION" != "$VERSION" ] || [ "$CONSTANT_VERSION" != "$VERSION" ] || [ "$STABLE_TAG" != "$VERSION" ]; then
            echo "Tag version is ${VERSION}, header is ${HEADER_VERSION}, constant is ${CONSTANT_VERSION}, stable tag is ${STABLE_TAG}."
            exit 1
          fi

      - name: Package theme
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          THEME_DIR="AI-html"
          PACKAGE="${THEME_DIR}-${VERSION}.zip"

          rm -rf dist
          mkdir -p "dist/${THEME_DIR}"

          rsync -a ./ "dist/${THEME_DIR}/" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'dist/' \
            --exclude '.gitignore' \
            --exclude '.gitattributes' \
            --exclude 'tests/' \
            --exclude 'tools/' \
            --exclude '*.md' \
            --exclude 'build-slot.php' \
            --exclude '*.zip' \
            --exclude '*.sha256.txt'

          cd dist
          zip -r "../${PACKAGE}" "${THEME_DIR}"
          cd ..
          sha256sum "${PACKAGE}" > "${PACKAGE}.sha256.txt"

      - name: Validate release package
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PACKAGE="AI-html-${VERSION}.zip"

          unzip -t "${PACKAGE}"
          unzip -Z1 "${PACKAGE}" | grep -qx 'AI-html/functions.php'
          unzip -Z1 "${PACKAGE}" | grep -qx 'AI-html/style.css'
          if unzip -Z1 "${PACKAGE}" | grep -Eq '(^|/)tests/|build-slot\.php$|\.md$|(^|/)\.git(hub)?/'; then
            echo "Release package contains development-only files."
            exit 1
          fi

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          THEME_DIR="AI-html"
          PACKAGE="${THEME_DIR}-${VERSION}.zip"

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "${PACKAGE}" \
              "${PACKAGE}.sha256.txt" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${PACKAGE}" \
              "${PACKAGE}.sha256.txt" \
              --title "${THEME_DIR} ${VERSION}" \
              --notes "Release ${VERSION}"
          fi

      - name: Build update manifest
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SLUG="ai-html"
          THEME_DIR="AI-html"
          PACKAGE="${THEME_DIR}-${VERSION}.zip"
          DOWNLOAD_URL="https://repository.smartecommerce.it/downloads/themes/${THEME_DIR}-${VERSION}.zip"
          SHA256="$(sha256sum "${PACKAGE}" | awk '{print $1}')"
          LAST_UPDATED="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          CHANGELOG="$(awk -v heading="## [${VERSION}]" '
            $0 == heading { found=1; next }
            found && /^## / { exit }
            found && /^- / { sub(/^- /, ""); print; exit }
          ' CHANGELOG.md)"
          if [ -z "${CHANGELOG}" ]; then
            CHANGELOG="Release ${VERSION}"
          fi

          jq -n \
            --arg version "${VERSION}" \
            --arg download_url "${DOWNLOAD_URL}" \
            --arg sha256 "${SHA256}" \
            --arg last_updated "${LAST_UPDATED}" \
            --arg changelog "${CHANGELOG}" \
            '{
              type: "theme",
              package_type: "theme",
              name: "AI-HTML",
              slug: "ai-html",
              version: $version,
              new_version: $version,
              download_url: $download_url,
              package: $download_url,
              homepage: "https://smartecommerce.it/",
              url: "https://smartecommerce.it/",
              requires: "6.5",
              tested: "7.0",
              requires_php: "7.4",
              author: "Smart eCommerce srls",
              description: "Tema enterprise AI-ready per siti corporate, magazine e piattaforme WordPress governate da design system, JSON e REST API.",
              changelog: $changelog,
              sha256: $sha256,
              checksum_sha256: $sha256,
              last_updated: $last_updated,
              documentation_url: "https://repository.smartecommerce.it/swagger/ai-html/",
              support_url: "https://smartecommerce.it/supporto",
              security_url: "https://smartecommerce.it/security",
              privacy_url: "https://smartecommerce.it/privacy",
              repository_url: "https://github.com/SmarteCommerceLab/AI-html",
              openapi_yaml: "https://repository.smartecommerce.it/api-docs/themes/ai-html/openapi.yaml",
              openapi_json: "https://repository.smartecommerce.it/api-docs/themes/ai-html/openapi.json",
              sections: {
                description: "Tema enterprise AI-ready per siti corporate, magazine e piattaforme WordPress governate da design system, JSON e REST API.",
                changelog: $changelog
              },
              banners: [],
              icons: []
            }' > "${SLUG}.json"

      - name: Require repository deployment credentials
        shell: bash
        run: |
          if [ -z "${REPOSITORY_FTP_USER}" ] || [ -z "${REPOSITORY_FTP_PASSWORD}" ]; then
            echo "Repository FTP credentials are not configured. The release cannot be marked successful without public deployment."
            exit 1
          fi

      - name: Deploy package and manifest to repository server
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SLUG="ai-html"
          THEME_DIR="AI-html"
          PACKAGE="${THEME_DIR}-${VERSION}.zip"

          curl --fail --ftp-create-dirs \
            --user "${REPOSITORY_FTP_USER}:${REPOSITORY_FTP_PASSWORD}" \
            --upload-file "${PACKAGE}" \
            "ftp://${REPOSITORY_FTP_HOST}${REPOSITORY_FTP_DOWNLOADS_PATH}/${PACKAGE}"

          curl --fail --ftp-create-dirs \
            --user "${REPOSITORY_FTP_USER}:${REPOSITORY_FTP_PASSWORD}" \
            --upload-file "${PACKAGE}.sha256.txt" \
            "ftp://${REPOSITORY_FTP_HOST}${REPOSITORY_FTP_DOWNLOADS_PATH}/${PACKAGE}.sha256.txt"

          curl --fail --ftp-create-dirs \
            --user "${REPOSITORY_FTP_USER}:${REPOSITORY_FTP_PASSWORD}" \
            --upload-file "${SLUG}.json" \
            "ftp://${REPOSITORY_FTP_HOST}${REPOSITORY_FTP_UPDATES_PATH}/${SLUG}.json"

      - name: Verify public deployment
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MANIFEST_URL="https://repository.smartecommerce.it/updates/themes/ai-html.json?release=${GITHUB_RUN_ID}"
          PACKAGE_URL="https://repository.smartecommerce.it/downloads/themes/AI-html-${VERSION}.zip"
          REMOTE_VERSION="$(curl --fail --silent --show-error "${MANIFEST_URL}" | jq -r '.version')"
          if [ "${REMOTE_VERSION}" != "${VERSION}" ]; then
            echo "Public manifest reports ${REMOTE_VERSION}, expected ${VERSION}."
            exit 1
          fi
          curl --fail --silent --show-error --head "${PACKAGE_URL}" >/dev/null
